<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dig Through Worlds</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=24">
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="chip coins" id="hCoins">0</span>
    <span class="chip" id="hDepth">0 m</span>
    <span class="chip" id="hBag"><i></i><span>🎒 0/10</span></span>
    <span class="chip" id="hInc" title="Museum visitors">🏛 +0/s</span>
    <div id="o2" title="Oxygen"><div></div></div>
    <span class="sp"></span>
    <button id="bMenu" title="Menu (Esc)">☰</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div id="toast"></div>
    <div id="stick" aria-hidden="true"><i class="an">↗</i><i class="ae">↘</i><i class="as">↙</i><i class="aw">↖</i><div id="knob"></div></div>
    <div id="lock" role="dialog" aria-label="Locked chest">
      <h3 id="lockTitle">🔒 A locked chest!</h3>
      <p id="lockHint">Tap the pins to match the golden key.</p>
      <div id="lockBoard"></div>
      <p class="prize">🔓 Open it for the treasure <b>+ a bonus 💎</b></p>
      <button class="btn" id="bSmash"><span id="smashFill"></span><span class="lbl">🔨 Hold to smash <small>(only a few coins)</small></span></button>
    </div>
    <div id="surface">
      <div id="sTop"><button class="btn" id="bClose">✕</button><h2 id="sTitle"></h2><p id="sRule"></p><button class="btn" id="bDig">⛏ Dig!</button></div>
      <div id="tabBody"></div>
    </div>
    <div id="splash">
      <h1>Dig Through Worlds</h1>
      <p>Dig down and find treasure!</p>
      <p>Fill the museum with bones!</p>
      <div class="go">Tap to play</div>
      <p class="help">Walk: arrows, WASD or tap<br>Dig: tap or Space</p>
      </div>
  </div>
  <div id="controls">
    <div id="btns">
      <button id="bHome">⬆ Home</button>
      <button id="bAuto" class="on" aria-label="Auto or manual digging">🤖 Auto</button>
    </div>
    <button id="bFast" aria-label="Dig faster">⛏<small>Faster</small></button>
  </div>
</div>
<script src="js/logic.js?v=24"></script>
<script src="js/post.js?v=24"></script>
<script src="js/sprites.js?v=24"></script>
<script src="js/render.js?v=24"></script>
<script src="js/audio.js?v=24"></script>
<script src="js/ui.js?v=24"></script>
</body>
</html>
